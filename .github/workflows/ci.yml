# Native app tests (docs/NATIVE_PLAN.md §6): IzzyKit unit tests on the Mac,
# then the app's unit + UI tests on an iOS simulator. No secrets; ad hoc signing
# of simulator builds only. TestFlight: testflight.yml + setup.yml (docs/CI.md).
name: CI

on:
  push:
    branches: [main]
    paths:
      - "ios/**"
      - ".github/workflows/ci.yml"
      - ".github/actions/xcodegen/**"
  pull_request:
    paths:
      - "ios/**"
      - ".github/workflows/ci.yml"
      - ".github/actions/xcodegen/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # GitHub's Xcode 27 image (actions/runner-images, "preview" in the README
  # table as of 2026-11-03; macOS 27 base). Xcode 27.1 is its default; 27.2
  # is installed as a Release Candidate with an Xcode_27.2.app symlink, and
  # the image update to the final 27.2 (27B52) is pending — so try the
  # stable symlink first, then the RC's own name.
  XCODE_CANDIDATES: >-
    /Applications/Xcode_27.2.app
    /Applications/Xcode_27.2_Release_Candidate.app

jobs:
  izzykit:
    name: IzzyKit (swift test)
    runs-on: xcode-27
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode 27.2
        run: |
          for x in $XCODE_CANDIDATES; do
            if [ -d "$x" ]; then sudo xcode-select -s "$x/Contents/Developer"; break; fi
          done
          xcodebuild -version
          case "$(xcodebuild -version | head -1)" in
            "Xcode 27.2"*) ;;
            *) echo "::error::Xcode 27.2 not found (tried: $XCODE_CANDIDATES)"; exit 1 ;;
          esac
      - name: swift test
        working-directory: ios/IzzyKit
        # the tests read the real bundled tables in ios/IzzyMap/Resources/Data
        run: swift test

  app:
    name: IzzyMap (xcodebuild test, simulator)
    runs-on: xcode-27
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode 27.2
        run: |
          for x in $XCODE_CANDIDATES; do
            if [ -d "$x" ]; then sudo xcode-select -s "$x/Contents/Developer"; break; fi
          done
          xcodebuild -version
          case "$(xcodebuild -version | head -1)" in
            "Xcode 27.2"*) ;;
            *) echo "::error::Xcode 27.2 not found (tried: $XCODE_CANDIDATES)"; exit 1 ;;
          esac
      # one exact, checksum-verified release (not whatever Homebrew has today)
      - uses: ./.github/actions/xcodegen
      - name: Generate the Xcode project
        working-directory: ios
        run: xcodegen generate
      - name: Pick a simulator
        id: sim
        # Newest available iOS runtime; an iPhone 16e (the target), else
        # another "e" model — created on that runtime when the image ships
        # none. Never "any iPhone": on 2026-11-03 that fallback picked the
        # foldable "iPhone Duo" (466 × 678 pt window), which never turned
        # landscape, so the rotation UI tests failed. Never hard-coded: the
        # image's device list changes with every update.
        run: |
          xcrun simctl list runtimes
          cat > "$RUNNER_TEMP/pick.py" <<'PY'
          import json, re, subprocess, sys
          def simctl(*args):
              return json.loads(subprocess.check_output(["xcrun", "simctl", "list", *args, "-j"]))
          def ver(rt):
              m = re.search(r"iOS-(\d+)-(\d+)", rt)
              return (int(m[1]), int(m[2])) if m else None
          runtimes = [r for r in simctl("runtimes")["runtimes"]
                      if r.get("isAvailable") and ver(r["identifier"]) and ver(r["identifier"]) >= (26, 0)]
          if not runtimes:
              sys.exit("no iOS 26+ simulator runtime")
          devs = simctl("devices", "available")["devices"]
          wanted = [re.compile(r"\b16e\b"), re.compile(r"\b\d+e\b")]
          # Newest runtime that has an e-model iPhone. A point release can be
          # device-specific (iOS 27.1 shipped only for the foldable iPhone
          # Duo, whose window never rotates), so fall back version by version.
          pick = None
          for v in sorted({ver(r["identifier"]) for r in runtimes}, reverse=True):
              # a version can come as several runtimes (e.g. a device-specific
              # "iOS-27-2-iPhone19-4" beside "iOS-27-2"): pool their devices
              ids = {r["identifier"] for r in runtimes if ver(r["identifier"]) == v}
              phones = [d for rt in ids for d in devs.get(rt, []) if d["name"].startswith("iPhone")]
              pick = next((d for w in wanted for d in phones if w.search(d["name"])), None)
              if pick is None:
                  types = [(r["identifier"], t) for r in runtimes if r["identifier"] in ids
                           for t in r.get("supportedDeviceTypes", [])]
                  made = next(((rt, t) for w in wanted for rt, t in types if w.search(t["name"])), None)
                  if made is not None:
                      rt, t = made
                      udid = subprocess.check_output(
                          ["xcrun", "simctl", "create", "CI " + t["name"], t["identifier"], rt], text=True).strip()
                      pick = {"name": t["name"] + " (created)", "udid": udid}
              if pick is not None:
                  break
          if pick is None:
              sys.exit("no iPhone e-model simulator or device type on any iOS 26+ runtime")
          print(pick["name"], "on iOS %d.%d" % v, file=sys.stderr)
          print(pick["udid"])
          PY
          udid=$(python3 "$RUNNER_TEMP/pick.py")
          echo "udid=$udid" >> "$GITHUB_OUTPUT"
      - name: xcodebuild test
        working-directory: ios
        # No -dataDir: the UI tests run without the developer's packs and
        # skip the data-dependent cases. Every UI test runs offline
        # (`-simulateOffline`, IzzyMapUITests/UITestSupport.swift).
        #
        # Signing: ad hoc ("Sign to Run Locally": no team, certificate or
        # profile), NOT CODE_SIGNING_ALLOWED=NO. An unsigned build carries no
        # entitlements, so the app group named by BAAppGroupID is missing
        # and Background Assets traps on first use: every plain launch
        # crashed (2026-11-03). Ad hoc keeps the simulator entitlements.
        #
        # The shared runner's simulator is several times slower than a Mac
        # (an XCUITest snapshot took 9–16 s): UI test timeouts are scaled.
        env:
          TEST_RUNNER_UI_TIMEOUT_SCALE: "3"
        run: |
          set -o pipefail
          xcodebuild test \
            -scheme IzzyMap \
            -destination "id=${{ steps.sim.outputs.udid }}" \
            -derivedDataPath build/dd \
            -resultBundlePath build/IzzyMap.xcresult \
            CODE_SIGN_STYLE=Manual CODE_SIGN_IDENTITY=- DEVELOPMENT_TEAM=
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: IzzyMap-xcresult
          path: ios/build/IzzyMap.xcresult
          retention-days: 7
