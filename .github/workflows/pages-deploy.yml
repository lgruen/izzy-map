name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # The app is built into _site/ once it exists; the probe page is
      # always deployed under /probe/.
      - name: Assemble site
        run: |
          mkdir -p _site
          cp -r probe _site/probe
          if [ -f app/package.json ]; then
            cd app
            npm ci
            npm run build
            cp -r dist/* ../_site/
            cd ..
          else
            printf '<!DOCTYPE html><meta charset="utf-8"><title>IzzyMap</title><p>IzzyMap app coming soon. <a href="probe/">Device probe</a>.' > _site/index.html
          fi

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
