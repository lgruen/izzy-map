<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <title>IzzyMap</title>
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="theme-color" content="#2d5f3f" />
    <link rel="apple-touch-icon" href="icons/icon-192.png" />
  </head>
  <body>
    <div id="map"></div>
    <div id="toolbar">
      <button id="btn-veg" title="Vegetation layer" aria-label="Toggle vegetation layer">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M20 4c-8.5 0-14 5.5-16 16 10.5-2 16-7.5 16-16Z" />
          <path d="M4 20C8 13 13 8 20 4" />
        </svg>
      </button>
      <button id="btn-legend" title="Legend" aria-label="Legend">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true">
          <rect x="3.2" y="4" width="5" height="5" rx="1.2" fill="currentColor" stroke="none" />
          <path d="M12 6.5h8.5" />
          <rect x="3.2" y="15" width="5" height="5" rx="1.2" />
          <path d="M12 17.5h8.5" />
        </svg>
      </button>
      <button id="btn-downloads" title="Offline maps" aria-label="Offline maps">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M12 3v10.5m0 0-4.2-4.2m4.2 4.2 4.2-4.2" />
          <path d="M4 16.5V18a3 3 0 0 0 3 3h10a3 3 0 0 0 3-3v-1.5" />
        </svg>
      </button>
      <button id="btn-about" title="About" aria-label="About IzzyMap">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true">
          <circle cx="12" cy="12" r="8.6" />
          <circle cx="12" cy="8.2" r="0.4" fill="currentColor" stroke-width="1.6" />
          <path d="M12 11.5v5" />
        </svg>
      </button>
    </div>
    <button id="nudge" hidden>
      Download maps for offline use
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M12 4v14m0 0-5.5-5.5M12 18l5.5-5.5" />
      </svg>
    </button>
    <div id="coords" title="Tap to switch coordinates"></div>
    <div id="sheet" hidden></div>
    <div id="panel" hidden></div>
    <div id="pdfview" hidden></div>
    <script type="module" src="src/main.ts"></script>
  </body>
</html>
