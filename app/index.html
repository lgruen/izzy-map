<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <title>IzzyMap</title>
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="theme-color" content="#2d5f3f" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#143024" media="(prefers-color-scheme: dark)" />
    <link rel="icon" href="icons/icon-192.png" />
    <link rel="apple-touch-icon" href="icons/icon-192.png" />
  </head>
  <body>
    <div id="map"></div>
    <div id="toolbar">
      <button id="btn-layers" title="Map layers" aria-label="Map layers">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M12 3.5 3.5 8 12 12.5 20.5 8Z" />
          <path d="M3.5 12 12 16.5 20.5 12" />
          <path d="M3.5 16 12 20.5 20.5 16" />
        </svg>
      </button>
      <button id="btn-legend" title="Legend" aria-label="Legend">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true">
          <rect x="3.2" y="4" width="5" height="5" rx="1.2" fill="currentColor" stroke="none" />
          <path d="M12 6.5h8.5" />
          <rect x="3.2" y="15" width="5" height="5" rx="1.2" />
          <path d="M12 17.5h8.5" />
        </svg>
      </button>
      <button id="btn-downloads" title="Offline maps" aria-label="Offline maps">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M12 3v10.5m0 0-4.2-4.2m4.2 4.2 4.2-4.2" />
          <path d="M4 16.5V18a3 3 0 0 0 3 3h10a3 3 0 0 0 3-3v-1.5" />
        </svg>
      </button>
      <button id="btn-about" title="About" aria-label="About IzzyMap">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true">
          <circle cx="12" cy="12" r="8.6" />
          <circle cx="12" cy="8.2" r="0.4" fill="currentColor" stroke-width="1.6" />
          <path d="M12 11.5v5" />
        </svg>
      </button>
    </div>
    <div id="mode-pill" aria-hidden="true"></div>
    <button id="nudge" hidden>
      <span id="nudge-text">Download maps for offline use</span>
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M12 4v14m0 0-5.5-5.5M12 18l5.5-5.5" />
      </svg>
    </button>
    <button id="coords" aria-label="Switch between MGA and latitude/longitude">
      <span id="coords-text"></span>
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M7 10 4 13l3 3M17 10l3 3-3 3M4 13h16"/></svg>
    </button>
    <div id="sheet" hidden></div>
    <div id="panel" hidden></div>
    <div id="pdfview" hidden></div>
    <script type="module" src="src/main.ts"></script>
  </body>
</html>
