# XcodeGen spec for the native IzzyMap app (docs/NATIVE_PLAN.md).
#   cd ios && xcodegen generate        # IzzyMap.xcodeproj is generated, never committed
# Simulator run with the developer's local packs (DEBUG builds only):
#   xcrun simctl launch <udid> org.gruenschloss.izzymap -dataDir /Users/leo/izzy-map/data
#   (+ -dataDirArrivesAfter 8: start empty, "install" the packs 8 s later)
# Without -dataDir (always in Release) the app reads the Background Assets
# packs (Data/PackStore.swift; -fetchPacks season-2021 asks for on-demand ones).
# Local pack serving needs an Xcode Run with Scheme ▸ Run ▸ Options ▸
# "Background Asset Packs" = data/packs (docs/NATIVE_PLAN.md §2 Pack facts).
name: IzzyMap
options:
  bundleIdPrefix: org.gruenschloss
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
  developmentLanguage: en

packages:
  # The distribution repo's default branch points at a globe pre-release:
  # always an exact version, never a branch or `from:`.
  MapLibre:
    url: https://github.com/maplibre/maplibre-gl-native-distribution
    exactVersion: 7.0.0
  IzzyKit:
    path: IzzyKit

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
    SWIFT_APPROACHABLE_CONCURRENCY: YES
    MARKETING_VERSION: "0.1"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: T4HS4UL2LT
    # local builds; CI archives override it per target (Config/Release.xcconfig)
    CODE_SIGN_STYLE: Automatic
    TARGETED_DEVICE_FAMILY: "1,2"

targets:
  IzzyMap:
    type: application
    platform: iOS
    # Release signing: automatic locally, manual match profile in CI (the
    # file includes the CI-only CI.generated.xcconfig; docs/CI.md). Every
    # target embedded in the archive (the IzzyMapAssets extension)
    # needs the same configFiles entry and CODE_SIGN_IDENTITY line, so its
    # profile and build number follow along (IzzyMapAssets has both).
    configFiles:
      Release: Config/Release.xcconfig
    sources:
      - path: IzzyMap/Sources
      - path: IzzyMap/Resources/Assets.xcassets
      # Icon Composer layered icon (iOS 26+); same name as the asset-catalog
      # AppIcon set, which stays as the pre-26 / fallback rendition
      - path: IzzyMap/Resources/AppIcon.icon
      # folder references: the bundle keeps the directory layout, so the
      # style can say asset://glyphs/{fontstack}/{range}.pbf
      - path: IzzyMap/Resources/Data
        type: folder
        buildPhase: resources
      - path: IzzyMap/Resources/glyphs
        type: folder
        buildPhase: resources
    dependencies:
      - package: MapLibre
        product: MapLibre
      - package: IzzyKit
        product: IzzyKit
      # Background Assets downloader (Apple hosting requires one); embedded
      # in IzzyMap.app/Extensions
      - target: IzzyMapAssets
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.gruenschloss.izzymap
        # XcodeGen's preset puts "iPhone Developer" here, at target level,
        # where it would beat Config/Release.xcconfig; CI's generated xcconfig
        # sets IZZY_CI_CODE_SIGN_IDENTITY (the match distribution cert).
        CODE_SIGN_IDENTITY: "$(IZZY_CI_CODE_SIGN_IDENTITY:default=iPhone Developer)"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: YES
        # the Background Assets keys (no INFOPLIST_KEY_ form); merged with
        # the generated ones
        INFOPLIST_FILE: IzzyMap/Info.plist
        INFOPLIST_KEY_CFBundleDisplayName: IzzyMap
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.navigation
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_NSLocationWhenInUseUsageDescription: >-
          IzzyMap shows where you are on the map and can follow you as you
          walk, and ranks plant suggestions by what is recorded nearby. Your
          location stays on this device.
        INFOPLIST_KEY_NSCameraUsageDescription: >-
          IzzyMap identifies a plant from a photo you take. The photo stays
          on this device.
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: >-
          UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft
          UIInterfaceOrientationLandscapeRight
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: >-
          UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown
          UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        # App Group (Background Assets) on both; increased-memory-limit on
        # devices only: the simulator signs ad hoc and can't carry it
        "CODE_SIGN_ENTITLEMENTS[sdk=iphoneos*]": IzzyMap/IzzyMap.entitlements
        "CODE_SIGN_ENTITLEMENTS[sdk=iphonesimulator*]": IzzyMap/IzzyMap-Simulator.entitlements

  # The Background Assets downloader extension for Apple-hosted packs
  # (Xcode's "Background Download" template, "Apple-Hosted, Managed"). Same
  # Release signing hook as the app (docs/CI.md): match profile, build number.
  IzzyMapAssets:
    type: extensionkit-extension
    platform: iOS
    configFiles:
      Release: Config/Release.xcconfig
    sources:
      - path: IzzyMapAssets
        excludes: [Info.plist, "*.entitlements"]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.gruenschloss.izzymap.assets
        PRODUCT_NAME: IzzyMapAssets
        CODE_SIGN_IDENTITY: "$(IZZY_CI_CODE_SIGN_IDENTITY:default=iPhone Developer)"
        CODE_SIGN_ENTITLEMENTS: IzzyMapAssets/IzzyMapAssets.entitlements
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_FILE: IzzyMapAssets/Info.plist
        INFOPLIST_KEY_CFBundleDisplayName: IzzyMap Assets
        # the ExtensionFoundation/StoreKit protocols are nonisolated
        SWIFT_DEFAULT_ACTOR_ISOLATION: nonisolated
        SKIP_INSTALL: YES

  IzzyMapTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: IzzyMapTests
    dependencies:
      - target: IzzyMap
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: org.gruenschloss.izzymap.tests

  IzzyMapUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: IzzyMapUITests
    dependencies:
      - target: IzzyMap
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: org.gruenschloss.izzymap.uitests
        # XCTestCase's overrides are nonisolated; tests opt in with @MainActor
        SWIFT_DEFAULT_ACTOR_ISOLATION: nonisolated

schemes:
  IzzyMap:
    build:
      targets:
        IzzyMap: all
        IzzyMapTests: [test]
        IzzyMapUITests: [test]
    run:
      config: Debug
      commandLineArguments:
        # DEBUG-only data override: the main checkout's packs (simulator)
        "-dataDir $(SRCROOT)/../data": true
    test:
      config: Debug
      gatherCoverageData: false
      targets:
        - IzzyMapTests
        - IzzyMapUITests
